branch:
  - reg: ^main$
    buttons:
      - name: 重建最新版本
        description: 用 main 当前代码重新构建产物并覆盖已有 Release（不升版本号）
        event: web_trigger_rebuild_release
        inputs:
          REBUILD_VERSION:
            name: 版本号
            description: 留空则取 version.json 的 latest，即当前最新版本
            placeholder: v1.3.0
            type: input
      - name: 构建docker镜像
        description: 构建完整docker镜像，上传到CNB和DockerHub
        event: web_trigger_docker
