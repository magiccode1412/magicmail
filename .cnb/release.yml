# ============================================================================
# 发版流水线：构建全平台产物并发布到 CNB Release
#
# 两个入口，共用同一套构建 stage（公共片段用 YAML 锚点抽到文件头部）：
#   1. tag_push                    推送 v* tag → 正常发版
#   2. web_trigger_rebuild_release 页面按钮 → 用当前分支代码重建已发布版本
#      场景：版本刚发布就发现产物有问题，main 上补了修复提交，但不想升版本号，
#            于是按原版本号重新构建并覆盖同名 Release（按钮见 .cnb/web_trigger.yml）
#
# 与 .github/workflows/release.yml 的关系：
#   两个平台各自独立发版，互不依赖。tag 推到 CNB 后，
#   1. 本文件负责 CNB 侧的 Release 与产物附件；
#   2. .cnb.yml 的 tag_push → git-sync 把 tag 同步到 GitHub，
#      由 GitHub Actions 的 release.yml 负责 GitHub 侧的 Release。
#   这样任一侧的流水线挂了，另一侧的版本产物仍然完整。
#
#   手动重建时两侧没有联动：CNB 点按钮只重建 CNB 的产物，
#   GitHub 侧需要在 Actions 里手动重跑 Build & Release（workflow_dispatch）。
#
# 产物：linux amd64/arm/arm64、darwin amd64/arm64、windows amd64
#        + 飞牛 fnOS 的 FPK 包（x86 与 ARM64 各一个）
#
# 分支约定：main 承担 release branch 角色，预发布与正式版的 tag 都必须打在
#           main 上，由 scripts/release-guard.sh 用 git merge-base 强制校验。
#           手动重建同理，只允许在 main 上执行（按钮也只在 main 分支显示）。
#
# 配置复用：两条流水线的构建 stage 完全一致，用 YAML 锚点抽到下面的 .release_*
#           顶层变量。锚点是 YAML 自身特性，只在单个文件内有效，不能跨 include
#           复用（跨文件要用 !reference 标签）；以 . 开头可避免被当成分支名。
#           这里只用别名（*xxx）、不用合并键（<<: *xxx）—— 部分 YAML 解析器
#           （含 CNB 可能使用的 js-yaml）不会展开合并键，用了会整条流水线失效。
# ============================================================================

.release_job:
  # fnpack 目前只有 linux-amd64 版本，固定调度到 amd64 节点
  runner: &release_runner
    tags: cnb:arch:amd64
    cpus: 8
  # 复用 dev 分支构建校验的环境镜像：Node 22 + pnpm 10 + Go 1.25 + fnpack + file
  docker: &release_docker
    build: .ci/Dockerfile
  env: &release_env
    # 飞牛统一网关前缀，必须与 fnapp/manifest 的 gatewayPrefix 一致
    GATEWAY_BASE: /app/magicmail
  endStages: &release_end_stages
    # 中间目录（源码副本、前端副本）不影响最终状态，成功失败都清掉
    - name: 清理构建中间产物
      script: rm -rf build

.release_stages:
  frontend: &stage_frontend
    name: 构建前端
    script: bash ./scripts/release-frontend.sh

  binary: &stage_binary
    name: 交叉编译
    jobs:
      linux-amd64:
        script: bash ./scripts/release-binary.sh linux amd64 7 magicmail
      linux-arm:
        script: bash ./scripts/release-binary.sh linux arm 7 magicmail-arm
      linux-arm64:
        script: bash ./scripts/release-binary.sh linux arm64 7 magicmail-arm64
      darwin-amd64:
        script: bash ./scripts/release-binary.sh darwin amd64 7 magicmail-macos-x86_64
      darwin-arm64:
        script: bash ./scripts/release-binary.sh darwin arm64 7 magicmail-macos-arm64
      windows-amd64:
        script: bash ./scripts/release-binary.sh windows amd64 7 magicmail.exe

  fpk: &stage_fpk
    name: 构建飞牛 FPK
    jobs:
      x86:
        script: bash ./scripts/release-fpk.sh x86 amd64 x86
      arm64:
        script: bash ./scripts/release-fpk.sh arm64 arm64 arm

  ls: &stage_ls
    name: 查看产物
    script: ls -lh dist/

  notes: &stage_notes
    name: 生成 Release 正文
    script: bash ./scripts/release-notes.sh

  # git:release 不支持上传附件，产物由本任务单独上传，
  # 因此顺序必须是先建 Release，再传附件。
  attachments: &stage_attachments
    name: 上传产物到 Release
    image: cnbcool/attachments
    settings:
      tag: ${APP_VERSION}
      attachments:
        - ./dist/magicmail
        - ./dist/magicmail-arm
        - ./dist/magicmail-arm64
        - ./dist/magicmail-macos-x86_64
        - ./dist/magicmail-macos-arm64
        - ./dist/magicmail.exe
        - ./dist/*.fpk

$:
  # --------------------------------------------------------------------------
  # 正常发版：推送 v* tag
  # --------------------------------------------------------------------------
  tag_push:
    - name: release
      runner: *release_runner
      docker: *release_docker
      env: *release_env
      stages:
        # -- 1. 入口校验 -----------------------------------------------------
        # 非 v* tag 会以退出码 78 结束：任务成功但中断流水线，不会显示成失败
        - name: 发布入口校验
          script: bash ./scripts/release-guard.sh
          exports:
            version: APP_VERSION
            prerelease: IS_PRERELEASE
            latest: IS_LATEST

        # -- 2. 前端 ---------------------------------------------------------
        # 构建两遍（默认 base / 网关 base），分别给普通二进制和 FPK 用
        - *stage_frontend

        # -- 3. 交叉编译 -----------------------------------------------------
        # 6 个平台并行，各自用独立的源码副本，避免 go:embed 目录互相覆盖
        - *stage_binary

        # -- 4. 飞牛 FPK -----------------------------------------------------
        - *stage_fpk

        # -- 5. 产物清单（调试用）--------------------------------------------
        - *stage_ls

        # -- 6. 发布 ---------------------------------------------------------
        - *stage_notes

        # preRelease 只接受布尔字面量（变量替换会被判为字符串），
        # 预发布与正式版拆成两个 stage 用 if 二选一。
        - name: 创建正式版 Release
          if: '[ "$IS_PRERELEASE" = "false" ]'
          type: git:release
          options:
            title: Magicmail ${APP_VERSION}
            descriptionFromFile: release-notes.md
            latest: true

        # 版本号带 - 后缀（v1.2.0-rc.1）走这里，标记预发布且不进 Latest
        - name: 创建预发布 Release
          if: '[ "$IS_PRERELEASE" = "true" ]'
          type: git:release
          options:
            title: Magicmail ${APP_VERSION}
            descriptionFromFile: release-notes.md
            preRelease: true
            latest: false

        - *stage_attachments
      endStages: *release_end_stages

  # --------------------------------------------------------------------------
  # 手动重建：页面按钮触发（.cnb/web_trigger.yml 的「重建最新版本」）
  #
  # 与 tag_push 的差别只有两点：
  #   1. 版本号来自按钮输入 / version.json，而不是 tag 名，因此必须显式传 tag
  #   2. Release 已存在，用 overlying: false（默认，先删后建）覆盖，
  #      旧附件随 Release 一起清掉，不会同名堆积
  #
  # 挂 $ 兜底分支：main 没有单独的分支配置，若挂在 main: 下会遮蔽 $ 的
  # push / tag_push（同步 GitHub + 发版），必须避开。
  # --------------------------------------------------------------------------
  web_trigger_rebuild_release:
    - name: rebuild-release
      runner: *release_runner
      docker: *release_docker
      env: *release_env
      stages:
        # -- 1. 入口校验 -----------------------------------------------------
        # 手动触发是明确意图，任何不合规都直接失败，不像 tag_push 那样静默跳过
        - name: 重建入口校验
          script: bash ./scripts/rebuild-guard.sh
          exports:
            version: APP_VERSION
            prerelease: IS_PRERELEASE
            latest: IS_LATEST

        # -- 2~5. 构建（与正常发版完全一致）-----------------------------------
        - *stage_frontend
        - *stage_binary
        - *stage_fpk
        - *stage_ls
        - *stage_notes

        # -- 6. 覆盖同名 Release ---------------------------------------------
        - name: 重建预发布 Release
          if: '[ "$IS_PRERELEASE" = "true" ]'
          type: git:release
          options:
            tag: ${APP_VERSION}
            overlying: false
            title: Magicmail ${APP_VERSION}
            descriptionFromFile: release-notes.md
            preRelease: true
            latest: false

        # 重建的是 version.json 里的最新版本，照常进 Latest
        - name: 重建正式版 Release
          if: '[ "$IS_PRERELEASE" = "false" ] && [ "$IS_LATEST" = "true" ]'
          type: git:release
          options:
            tag: ${APP_VERSION}
            overlying: false
            title: Magicmail ${APP_VERSION}
            descriptionFromFile: release-notes.md
            latest: true

        # 重建历史版本时不动 Latest，否则会把当前最新版本顶下去
        - name: 重建历史版本 Release
          if: '[ "$IS_PRERELEASE" = "false" ] && [ "$IS_LATEST" = "false" ]'
          type: git:release
          options:
            tag: ${APP_VERSION}
            overlying: false
            title: Magicmail ${APP_VERSION}
            descriptionFromFile: release-notes.md
            latest: false

        - *stage_attachments
      endStages: *release_end_stages
