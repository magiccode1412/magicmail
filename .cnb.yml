# 发版流水线（tag_push → 构建 + CNB Release）单独拆文件，
# 与下面的同步流水线按事件合并：$.tag_push 数组会追加，互不影响。
include:
  - .cnb/release.yml

# 同步到 GitHub
.sync_to_github: &sync_to_github
  name: sync_to_github
  imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
  stages:
    - name: sync_to_github
      image: tencentcom/git-sync
      settings:
        target_url: https://github.com/${GITHUB_USERNAME}/${CNB_REPO_NAME_LOWERCASE}.git
        auth_type: https
        username: "${GITHUB_USERNAME}"
        password: "${GITHUB_ACCESS_TOKEN}"
        force: true
        push_tags: true


# 开发分支
dev:
  push:
    # 同步到 GitHub
    - <<: *sync_to_github

    # 构建校验
    - name: build-verify
      runner:
        cpus: 8
      docker:
        build: .ci/Dockerfile
      stages:
        - name: 构建校验
          script: bash ./scripts/verify-build.sh

  # 构建开发Docker镜像
  web_trigger_docker_dev:
    - services:
        - docker
      name: 构建开发Docker
      imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
      stages:
        - name: docker build && push
          script: bash ./scripts/docker.sh dev

  # 同步GitHub到CNBC
  web_trigger_sync_from_github:
    - imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
      stages:
        - name: sync from github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/${GITHUB_USERNAME}/${CNB_REPO_NAME_LOWERCASE}.git
            auth_type: https
            username: "${GITHUB_USERNAME}"
            password: "${GITHUB_ACCESS_TOKEN}"
            sync_mode: pull

# 主分支
main:
  # 发版
  tag_push:
    - <<: *sync_to_github
    - name: 构建Docker镜像
      services:
        - docker
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
      stages:
        - name: 获取版本号
          script: |
            # version.json 没有 version 字段，最新版本号在 latest（形如 v1.2.0）；
            # Docker 镜像标签惯例不带 v 前缀，这里一并去掉
            VERSION=$(jq -r '.latest // empty' /workspace/version.json | sed 's/^v//')
            if [ -z "${VERSION}" ]; then
              echo "::error::version.json 中未取到 latest 版本号"
              exit 1
            fi
            echo "##[set-output app_version=$VERSION]"
          exports:
            app_version: APP_VERSION
        - name: 登录Docker仓库
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: 构建和推送Docker镜像
          script: docker buildx build -t ${IMAGE_TAG} -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${APP_VERSION} --platform linux/amd64,linux/arm64,linux/arm/v7 --push .

# 全局
$:
  vscode:
    - docker:
        build: .cnb/Dockerfile
      services:
        - name: vscode
          options:
            keepAliveTimeout: 2h
        - docker
      stages:
        - name: ls
          script: ls -a

  web_trigger_docker_cnb:
    - runner:
        tags: cnb:arch:amd64
      services:
        - docker
      imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-amd64
      stages:
        - name: docker build
          script: docker build -t ${IMAGE_TAG} .
        - name: docker push
          script: |
            docker push ${IMAGE_TAG}
        - name: resolve
          type: cnb:resolve
          options:
            key: build-amd64 
          
    - runner:
        tags: cnb:arch:arm64:v8
      services:
        - docker
      imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-arm64
      stages:
        - name: docker build
          script: docker build -t ${IMAGE_TAG} .
        - name: docker push
          script: |
            docker push ${IMAGE_TAG}
        - name: resolve
          type: cnb:resolve
          options:
            key: build-arm64

    - services:
        - docker
      imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
      env:
        IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
      stages:
        - name: get_version
          script: |
            # version.json 没有 version 字段，最新版本号在 latest（形如 v1.2.0）；
            # Docker 镜像标签惯例不带 v 前缀，这里一并去掉
            VERSION=$(jq -r '.latest // empty' /workspace/version.json | sed 's/^v//')
            if [ -z "${VERSION}" ]; then
              echo "::error::version.json 中未取到 latest 版本号"
              exit 1
            fi
            echo "##[set-output app_version=$VERSION]"
          exports:
            app_version: APP_VERSION
        - name: await the amd64
          type: cnb:await
          options:
            key: build-amd64
        - name: await the arm64
          type: cnb:await
          options:
            key: build-arm64
        - name: manifest_cnb
          image: cnbcool/manifest
          settings:
            target: ${IMAGE_TAG}
            template: ${IMAGE_TAG}-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        - name: manifest_cnb_version
          image: cnbcool/manifest
          settings:
            target: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${APP_VERSION}
            template: ${IMAGE_TAG}-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        - name: remove tag
          type: artifact:remove-tag
          options:
            name: ${CNB_REPO_NAME}
            tags:
              - latest-linux-amd64
              - latest-linux-arm64
            type: docker