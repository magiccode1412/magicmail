# 发版流水线（tag_push → 构建 + CNB Release）单独拆文件，
# 与下面的同步流水线按事件合并：$.tag_push 数组会追加，互不影响。
include:
  - .cnb/release.yml

# 同步到 GitHub 流水线
.sync_to_github: &sync_to_github
  name: sync_to_github
  imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
  stages:
    - name: sync_to_github
      image: tencentcom/git-sync
      settings:
        target_url: https://github.com/${GITHUB_USERNAME}/${CNB_REPO_NAME_LOWERCASE}.git
        auth_type: https
        username: "${GITHUB_USERNAME}"
        password: "${GITHUB_ACCESS_TOKEN}"
        force: true
        push_tags: true

# 构建Docker镜像流水线
.build_docker: &build_docker
  name: 构建Docker镜像
  imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
  services:
    - docker
  env:
    IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
    DOCKERHUB_IMAGE_TAG: ${DOCKERHUB_USERNAME}/${CNB_REPO_NAME_LOWERCASE}:latest
  stages:
    - name: 获取版本号
      script: |
        # version.json 没有 version 字段，最新版本号在 latest（形如 v1.2.0）；
        # Docker 镜像标签惯例不带 v 前缀，这里一并去掉
        VERSION=$(jq -r '.latest // empty' /workspace/version.json | sed 's/^v//')
        if [ -z "${VERSION}" ]; then
          echo "::error::version.json 中未取到 latest 版本号"
          exit 1
        fi
        echo "##[set-output app_version=$VERSION]"
      exports:
        app_version: APP_VERSION
    - name: 登录Docker仓库
      script: |
        docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        docker login -u "${DOCKERHUB_USERNAME}" -p "${DOCKERHUB_TOKEN}"
    - name: 构建和推送Docker镜像
      script: |
        docker buildx build \
          -t ${IMAGE_TAG} \
          -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${APP_VERSION} \
          -t ${DOCKERHUB_IMAGE_TAG} \
          -t ${DOCKERHUB_USERNAME}/${CNB_REPO_NAME_LOWERCASE}:${APP_VERSION} \
          --platform linux/amd64,linux/arm64,linux/arm/v7 --push .


# 开发分支
dev:
  push:
    # 构建校验
    - name: build-verify
      runner:
        cpus: 8
      docker:
        build: .ci/Dockerfile
      stages:
        - name: 构建校验
          script: bash ./scripts/verify-build.sh

# 主分支
main:
  push:
    - <<: *sync_to_github
  tag_push:
    - <<: *build_docker
  web_trigger_docker:
    - <<: *build_docker

# 全局
$:
  vscode:
    - docker:
        build: .cnb/Dockerfile
      services:
        - name: vscode
          options:
            keepAliveTimeout: 2h
        - docker
      stages:
        - name: ls
          script: ls -a