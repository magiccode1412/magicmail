$:
  vscode:
    - docker:
        build: .ide/Dockerfile
      services:
        - name: vscode
          options:
            keepAliveTimeout: 2h
        - docker

  push:
      - imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
        stages:
          - name: sync_to_github
            image: tencentcom/git-sync
            settings:
              target_url: https://github.com/${GITHUB_USERNAME}/${CNB_REPO_NAME_LOWERCASE}.git
              auth_type: https
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_ACCESS_TOKEN}"
              force: true
              # push_tags 默认 false，只同步分支不同步标签，
              # 会导致 GitHub Actions 里 tags: ['v*'] 的工作流永远不会触发。
              push_tags: true

  web_trigger_docker_cnb:
    - runner:
        tags: cnb:arch:amd64
      services:
        - docker
      imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
      env:
        CNB_IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-amd64
      stages:
        - name: docker build
          script: docker build -t ${CNB_IMAGE_TAG} .
        - name: docker push
          script: |
            docker push ${CNB_IMAGE_TAG}
        - name: resolve
          type: cnb:resolve
          options:
            key: build-amd64 
          
    - runner:
        tags: cnb:arch:arm64:v8
      services:
        - docker
      imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
      env:
        CNB_IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest-linux-arm64
      stages:
        - name: docker build
          script: docker build -t ${CNB_IMAGE_TAG} .
        - name: docker push
          script: |
            docker push ${CNB_IMAGE_TAG}
        - name: resolve
          type: cnb:resolve
          options:
            key: build-arm64

    - services:
        - docker
      imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
      env:
        CNB_IMAGE_TAG: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
      stages:
        - name: get_version
          script: |
            # version.json 没有 version 字段，最新版本号在 latest（形如 v1.2.0）；
            # Docker 镜像标签惯例不带 v 前缀，这里一并去掉
            VERSION=$(jq -r '.latest // empty' /workspace/version.json | sed 's/^v//')
            if [ -z "${VERSION}" ]; then
              echo "::error::version.json 中未取到 latest 版本号"
              exit 1
            fi
            echo "##[set-output app_version=$VERSION]"
          exports:
            app_version: APP_VERSION
        - name: await the amd64
          type: cnb:await
          options:
            key: build-amd64
        - name: await the arm64
          type: cnb:await
          options:
            key: build-arm64
        - name: manifest_cnb
          image: cnbcool/manifest
          settings:
            target: ${CNB_IMAGE_TAG}
            template: ${CNB_IMAGE_TAG}-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        - name: manifest_cnb_version
          image: cnbcool/manifest
          settings:
            target: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${APP_VERSION}
            template: ${CNB_IMAGE_TAG}-OS-ARCH
            platforms:
              - linux/amd64
              - linux/arm64
        - name: remove tag
          type: artifact:remove-tag
          options:
            name: ${CNB_REPO_NAME}
            tags:
              - latest-linux-amd64
              - latest-linux-arm64
            type: docker

dev:
  web_trigger_docker_dev:
    - services:
        - docker
      imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
      stages:
        - name: docker build && push
          script: bash ./scripts/docker.sh dev

  web_trigger_sync_from_github:
    - imports: https://cnb.cool/magiccode1412/secret/-/blob/main/env.yml
      stages:
        - name: sync from github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/${GITHUB_USERNAME}/${CNB_REPO_NAME_LOWERCASE}.git
            auth_type: https
            username: "${GITHUB_USERNAME}"
            password: "${GITHUB_ACCESS_TOKEN}"
            sync_mode: pull
