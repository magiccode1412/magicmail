# ============================================================================
# Magicmail CI/CD - 多架构构建 & 发布到 GitHub Release
# 触发条件：推送 v* 开头的 tag（如 v1.0.0 / v1.2.0-rc.1）
# 构建产物：linux amd64/arm/arm64、darwin amd64/arm64、windows amd64
#           + FPK 包（飞牛 fnOS：x86 与 ARM64 各一个）
#
# 分支约定：main 承担 release branch 的角色（代码冻结窗口），dev 为日常开发分支。
#   预发布（v1.2.0-rc.N）与正式版（v1.2.0）的 tag 都必须打在 main 上，
#   由 guard job 用 git merge-base 强制校验，打在其他分支上会直接失败。
# ============================================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 支持手动触发（仅允许在 main 分支上补发）
    inputs:
      version:
        description: '版本号 (如 v1.2.0 或 v1.2.0-rc.2)，必填'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ==========================================================================
  # Job 0: 发布入口校验（guard）
  #   - 版本号必须符合 vX.Y.Z（允许 -rc.N 等预发布后缀）
  #   - tag 指向的提交必须在 main 分支上（main 承担 release branch 角色）
  #   - 手动触发必须显式填写版本号，且只能在 main 分支执行
  # ==========================================================================
  guard:
    name: Verify Release Entry
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # 需要完整历史才能做 merge-base 判断

      # tag 推送时 checkout 只拉了这一个 ref，main 分支的引用需要手动补
      - name: 拉取 main 分支引用
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: 校验版本号与分支归属
        id: check
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -z "${INPUT_VERSION}" ]; then
              echo "::error::手动触发必须填写版本号（如 v1.2.0）"
              exit 1
            fi
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "::error::手动触发只能在 main 分支执行，当前分支: ${GITHUB_REF_NAME}"
              exit 1
            fi
            VERSION="${INPUT_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          # vX.Y.Z 或 vX.Y.Z-<预发布标识>
          if ! printf '%s' "${VERSION}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号 ${VERSION} 不符合 vX.Y.Z 规范（预发布可用 v1.2.0-rc.1）"
            exit 1
          fi

          # 预发布与正式版都要求在 main 上：rc 必须是功能冻结的候选，不能打在 dev 上
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "手动补发: 跳过提交归属校验（按 main 分支当前 HEAD 构建）"
          elif ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${VERSION} 指向的提交 $(git rev-parse --short HEAD) 不在 main 分支上，拒绝发布"
            exit 1
          else
            echo "OK: ${VERSION} @ $(git rev-parse --short HEAD) 位于 main"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # Job 1: 构建前端（只需执行一次，所有平台共用）
  # ==========================================================================
  build-frontend:
    name: Build Frontend
    needs: guard
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - run: pnpm build
        working-directory: web

      # 将前端产物打包上传，供后续编译任务使用
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: server/dist/
          retention-days: 1

  # ==========================================================================
  # Job 2: 多架构交叉编译 Go 二进制
  # ==========================================================================
  build-binary:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: build-frontend
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm
            goarm: '7'
            suffix: '-arm'
          - goos: linux
            goarch: arm64
            suffix: '-arm64'
          - goos: darwin
            goarch: amd64
            suffix: '-macos-x86_64'
          - goos: darwin
            goarch: arm64
            suffix: '-macos-arm64'
          - goos: windows
            goarch: amd64
            suffix: '.exe'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'   # 与 server/go.mod 的 go 1.25.0 保持一致
          cache-dependency-path: server/go.sum

      # 下载前端构建产物
      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: server/embedfs/dist/

      # 编译（前端已就位，//go:embed 直接嵌入）
      - name: Build Go binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '7' }}
          CGO_ENABLED: 0
        working-directory: server
        run: |
          OUTPUT="../dist/magicmail${{ matrix.suffix }}"
          go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.isProduction=true" \
            -o "${OUTPUT}" \
            .
          echo "Built: $(du -h ${OUTPUT} | cut -f1)"

      # 上传单个二进制产物
      - uses: actions/upload-artifact@v5
        with:
          name: magicmail-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/magicmail${{ matrix.suffix }}
          retention-days: 1

  # ==========================================================================
  # Job 3: 构建 FPK 包（飞牛 fnOS 应用包，x86 + ARM64 双架构）
  # ==========================================================================
  build-fpk:
    name: Build FPK (${{ matrix.arch }})
    needs: guard
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    # 注意：不能复用 build-binary 的 linux/amd64 二进制！
    # 那份二进制嵌入的前端 base 为 '/'，在统一网关 /app/magicmail 前缀下会 404 白屏。
    # 飞牛形态必须单独以 BASE_URL=/app/magicmail 构建前端并重新编译二进制。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # fnOS manifest 的 platform 合法取值为 x86 / arm / all；
          # ARM64 设备属于 arm 平台，因此 arm64 包声明 platform = arm。
          - arch: x86
            goarch: amd64
            platform: x86
          - arch: arm64
            goarch: arm64
            platform: arm
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Build frontend with gateway base
        working-directory: web
        env:
          BASE_URL: /app/magicmail
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # 断言 guard：网关下一旦 base 丢失就是白屏，宁可 CI 失败也不要出坏包
      - name: Verify gateway base
        run: |
          if ! grep -q '"/app/magicmail/' server/dist/index.html; then
            echo "::error::前端 index.html 未带 /app/magicmail 前缀，网关下会白屏"
            exit 1
          fi
          if grep -q '"src":"/icons/' server/dist/manifest.webmanifest; then
            echo "::error::manifest.webmanifest 图标未带 /app/magicmail 前缀，网关下会 404"
            exit 1
          fi
          echo "OK: 前端产物已带 /app/magicmail 前缀"

      - name: Build Go binary for FPK
        working-directory: server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../fnapp/app/server
          rm -rf embedfs/dist
          cp -r dist embedfs/dist
          go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.isProduction=true" \
            -o ../fnapp/app/server/magicmail \
            .
          chmod +x ../fnapp/app/server/magicmail
          echo "Built: $(du -h ../fnapp/app/server/magicmail | cut -f1)"
          file ../fnapp/app/server/magicmail || true

      # 架构装错 = 装上就跑不起来，这里直接卡住
      - name: Verify binary arch
        run: |
          BIN="fnapp/app/server/magicmail"
          if ! command -v file >/dev/null 2>&1; then
            echo "::warning::未找到 file 命令，跳过二进制架构校验"
            exit 0
          fi
          INFO="$(file -b "${BIN}")"
          echo "Binary: ${INFO}"
          case "${{ matrix.goarch }}" in
            amd64) echo "${INFO}" | grep -q 'x86-64' || { echo "::error::期望 x86_64 二进制，实际: ${INFO}"; exit 1; } ;;
            arm64) echo "${INFO}" | grep -qE 'aarch64|ARM' || { echo "::error::期望 ARM64 二进制，实际: ${INFO}"; exit 1; } ;;
          esac

      # 架构声明必须与包内二进制一致，否则目标设备安装时会拒绝
      - name: Set manifest platform
        working-directory: fnapp
        run: |
          sed -i "s|^platform *=.*|platform              = ${{ matrix.platform }}|" manifest
          grep '^platform' manifest

      - name: Install fnpack
        run: |
          # 安装 fnpack CLI 工具（飞牛应用打包工具）
          wget -q https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 -O /usr/local/bin/fnpack
          chmod +x /usr/local/bin/fnpack
          fnpack --help

      - name: Build FPK package
        working-directory: fnapp
        run: fnpack build

      # fnpack 输出的包名不固定，这里统一成 名称-版本-架构.fpk
      - name: Rename FPK
        working-directory: fnapp
        run: |
          SRC="$(ls *.fpk 2>/dev/null | head -1)"
          if [ -z "${SRC}" ]; then
            echo "::error::fnapp/ 下未找到 .fpk 产物"
            exit 1
          fi
          DST="magicmail-${VERSION}-${{ matrix.arch }}.fpk"
          if [ "${SRC}" != "${DST}" ]; then
            mv "${SRC}" "${DST}"
          fi
          ls -lh *.fpk

      - uses: actions/upload-artifact@v5
        with:
          name: fpk-${{ matrix.arch }}
          path: fnapp/*.fpk
          retention-days: 1

  # ==========================================================================
  # Job 4: 创建 GitHub Release，附带所有平台产物
  # ==========================================================================
  release:
    name: Create GitHub Release
    needs: [guard, build-binary, build-fpk]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # changelog 回退分支需要读 tag 历史

      # 下载全部编译产物
      - uses: actions/download-artifact@v5
        with:
          path: all-artifacts
          pattern: magicmail-*
          merge-multiple: false

      # 下载 FPK 产物（x86 + arm64，两个 job 的产物合并到同一目录）
      - uses: actions/download-artifact@v5
        with:
          pattern: fpk-*
          path: all-artifacts/fpk
          merge-multiple: true

      # 查看产物结构（调试用）
      - name: List artifacts
        run: find all-artifacts -type f | sort

      # 生成 Release 正文：优先取 docs/guide/changelog.md 中对应版本的条目。
      # 不直接用 git log 的原因：main 只在发版时接收 dev 的合并，历史很短，
      # 自动生成只能覆盖到 merge commit，内容严重缺失。
      - name: Generate changelog
        id: changelog
        run: |
          BASE="${VERSION%%-*}"          # v1.2.0-rc.1 → v1.2.0
          NOTES=""
          if [ -f docs/guide/changelog.md ]; then
            NOTES="$(awk -v base="${BASE}" '
              BEGIN { want = "## [" base "]" }
              !found && index($0, want) == 1 {
                rest = substr($0, length(want) + 1)
                if (rest == "" || rest ~ /^[ -]/) { found = 1 }
                next
              }
              found && /^## \[/ { exit }
              found { lines[++n] = $0 }
              END {
                while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--
                for (i = 1; i <= n; i++) print lines[i]
              }
            ' docs/guide/changelog.md)"
          fi
          # changelog.md 里没有对应条目时回退到 git log。
          # 不用 --pretty=format:"..." 内联写法，那会把 format: 原样输出进正文。
          if [ -z "${NOTES}" ]; then
            echo "::warning::docs/guide/changelog.md 中未找到 ${BASE} 条目，回退到 git log"
            PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
            if [ -n "${PREV_TAG}" ]; then
              NOTES="$(git log --no-merges --pretty='%h%x09%s' "${PREV_TAG}..HEAD" \
                       | awk -F'\t' '{ printf "- %s (%s)\n", $2, $1 }')"
            else
              NOTES="$(git log --no-merges --pretty='%h%x09%s' \
                       | awk -F'\t' '{ printf "- %s (%s)\n", $2, $1 }')"
            fi
          fi
          if [ -z "${NOTES}" ]; then
            NOTES="- 本次无详细变更记录"
          fi
          # 分隔符带 run id，避免正文里出现 EOF 破坏 heredoc
          DELIM="__REL_BODY_${GITHUB_RUN_ID}__"
          # 写入 GITHUB_OUTPUT 供后续步骤使用
          {
            echo "changelog<<${DELIM}"
            echo "## 📦 Magicmail ${VERSION}"
            echo ""
            echo "### 变更内容"
            echo ""
            printf '%s\n' "${NOTES}"
            echo ""
            echo "### 下载"
            echo ""
            echo "| 平台 | 架构 | 文件 |"
            echo "|------|------|------|"
            echo "| Linux | x86_64 | \`magicmail\` |"
            echo "| Linux | ARM32 (armv7) | \`magicmail-arm\` |"
            echo "| Linux | ARM64 | \`magicmail-arm64\` |"
            echo "| macOS | Intel | \`magicmail-macos-x86_64\` |"
            echo "| macOS | Apple Silicon | \`magicmail-macos-arm64\` |"
            echo "| Windows | x86_64 | \`magicmail.exe\` |"
            echo ""
            echo "### 飞牛 fnOS 应用包"
            echo ""
            echo "| 平台 | 文件 | 说明 |"
            echo "|------|------|------|"
            echo "| 飞牛 fnOS (x86_64) | \`magicmail-${VERSION}-x86.fpk\` | 一键安装到飞牛系统 |"
            echo "| 飞牛 fnOS (ARM64) | \`magicmail-${VERSION}-arm64.fpk\` | 一键安装到飞牛系统 |"
            echo ""
            echo "> 解压后直接运行，无需额外依赖。默认监听 \`http://localhost:8080\`"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      # 创建 Release 并上传所有资产
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.version }}
          name: "Magicmail ${{ needs.guard.outputs.version }}"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          # 版本号带 - 后缀（v1.2.0-rc.1）就标记为预发布，不进 Latest
          prerelease: ${{ contains(needs.guard.outputs.version, '-') }}
          files: |
            all-artifacts/magicmail-linux-amd64/magicmail
            all-artifacts/magicmail-linux-arm/magicmail-arm
            all-artifacts/magicmail-linux-arm64/magicmail-arm64
            all-artifacts/magicmail-darwin-amd64/magicmail-macos-x86_64
            all-artifacts/magicmail-darwin-arm64/magicmail-macos-arm64
            all-artifacts/magicmail-windows-amd64/magicmail.exe
            all-artifacts/fpk/*.fpk