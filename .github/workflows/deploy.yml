# 工作流名称：构建并部署文档到 GitHub Pages
name: Deploy Docs to GitHub Pages

# 触发条件：
# 1. 推送到 main 分支时自动触发（文档以 main 为准，dev 分支不自动部署）
# 2. 在 GitHub 网页端手动触发（Actions 页面点击 Run workflow）
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 使用官方 Pages Action 部署（上传产物方式），不需要 gh-pages 分支
permissions:
  contents: read
  pages: write
  id-token: write

# 并发保护：排队中的旧部署会被跳过，但不会中断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

# 部署到 GitHub Pages 时的资源基础路径（子路径部署需以 / 开头、不以 / 结尾）
# 例如仓库名为 magicmail，则访问地址为 https://<username>.github.io/magicmail/
env:
  VITEPRESS_BASE: /magicmail

jobs:
  # ==========================================================================
  # Job 1: 构建文档
  # ==========================================================================
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      # 步骤1：检出仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤2：安装 Node.js 20 环境
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 步骤3：安装 pnpm（docs 使用 pnpm 管理依赖）
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 步骤4：安装依赖（使用 pnpm-lock.yaml 精确还原）
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 步骤5：构建项目
      # VitePress 通过 VITEPRESS_BASE 环境变量设置 base，
      # 确保部署到子路径时资源引用正确
      - name: 构建项目
        run: pnpm run build

      # 步骤6：读取 Pages 配置
      # enablement: Pages 尚未启用时自动启用并切换为 Actions 部署模式
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 步骤7：上传构建产物
      # 注意：路径相对仓库根目录，VitePress 输出在 docs/.vitepress/dist
      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # ==========================================================================
  # Job 2: 部署到 GitHub Pages
  # ==========================================================================
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
